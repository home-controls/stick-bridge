name: Idea or new stick
description: A feature, or a stick the bridge should know
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: For a new stick, give its model, USB VID:PID and product string, chip, and firmware.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it help with?
