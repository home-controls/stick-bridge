# A release: push a tag v<version> (version.txt) on a commit that is on main (merged through a pull request).
# See docs/RELEASING.md. A tag v<x.y.z>-rcN is a release candidate: published as a GitHub pre-release, which
# releases/latest (the bridges' default update feed) never serves, so only testers who install it get it.
#   1. checks the tag against version.txt and CHANGELOG.md, and that the tagged commit is on main
#   2. runs CI on GitHub's hosted runners (never the self-hosted one), which builds the firmware and the
#      release files
#   3. waits for the maintainer's approval (environment "release"), signs the files' build provenance
#      (gh attestation verify <file> --repo <this repo>) and makes the GitHub release; bridges see it at their
#      next check, since they read releases/latest/download/manifest.json
# Run by hand (Actions, Release, Run workflow) it is a dry run: it builds everything and publishes nothing.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  info:
    name: Check the release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(python3 tools/release_info.py --tag "$GITHUB_REF_NAME")
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::$GITHUB_REF_NAME isn't on main: merge the release pull request first, then tag main"
              exit 1
            fi
            publish=true
          else
            version=$(python3 tools/release_info.py)
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Stick Bridge $version ($([ "$publish" = true ] && echo release || echo dry run))" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: info
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      runner: ubuntu-24.04
    secrets:
      PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}

  publish:
    name: Publish
    needs: [info, ci]
    if: needs.info.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # Settings, Environments, release: the maintainer is its required reviewer (each release waits for an
    # approval) and only v* tags may use it
    environment: release
    permissions:
      contents: write # make the release
      id-token: write # sign the build provenance
      attestations: write # store that signed provenance
    env:
      VERSION: ${{ needs.info.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: The files are this version's, intact
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          test "$(jq -r .version manifest.json)" = "$VERSION"
          test -f "zigbee_eth_bridge-$VERSION.bin" && test -f "zigbee_eth_bridge-$VERSION-full.bin"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.bin
            dist/manifest.json
      - name: GitHub release (the bridges' update feed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_info.py --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md" >/dev/null
          case "$VERSION" in
            *-rc*) kind=(--prerelease --latest=false); title="Stick Bridge $VERSION (release candidate)" ;;
            *) kind=(--latest); title="Stick Bridge $VERSION" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" "${kind[@]}" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
