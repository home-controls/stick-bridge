# A release: push a tag v<version> (version.txt) on a commit that follows main.
#   1. checks the tag against version.txt and CHANGELOG.md, and that main can move to it
#   2. runs CI, which builds the firmware and the release files
#   3. signs their build provenance (gh attestation verify <file> --repo <this repo>), moves main to
#      the tag and makes the GitHub release; bridges see it at their next check, since they read
#      releases/latest/download/manifest.json
# Run by hand (Actions, Release, Run workflow) it is a dry run: it builds everything and publishes nothing.
name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  info:
    name: Check the release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(python3 tools/release_info.py --tag "$GITHUB_REF_NAME")
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "::error::$GITHUB_REF_NAME doesn't follow main, so main can't move to it: tag a commit on top of main"
              exit 1
            fi
            publish=true
          else
            version=$(python3 tools/release_info.py)
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Zigbee Bridge $version ($([ "$publish" = true ] && echo release || echo dry run))" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: CI
    needs: info
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [info, ci]
    if: needs.info.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # Settings, Environments, release: add yourself as a required reviewer to approve each release by
    # hand, and limit it to v* tags
    environment: release
    permissions:
      contents: write # move main, make the release
      id-token: write # sign the build provenance
      attestations: write # store that signed provenance
    env:
      VERSION: ${{ needs.info.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the push below gets the token for itself only
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: The files are this version's, intact
        working-directory: dist
        run: |
          sha256sum -c SHA256SUMS
          test "$(jq -r .version manifest.json)" = "$VERSION"
          test -f "zigbee_eth_bridge-$VERSION.bin" && test -f "zigbee_eth_bridge-$VERSION-full.bin"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.bin
            dist/manifest.json
      - name: Move main to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/main"
      - name: GitHub release (the bridges' update feed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_info.py --tag "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md" >/dev/null
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Zigbee Bridge $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
